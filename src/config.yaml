site:
  name: Mobile-Tech, LLC
  site: 'https://www.mobile-tech-llc.com/'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: Mobile-Tech, LLC
    template: '%s - Mobile-Tech, LLC'
  description: 'Mobile-Tech is a personal IT department for the home, and trusted enterprise IT support, in Tucson since 2005. Choose an ongoing membership plan or one-time help with computers, Wi-Fi, servers, and more.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Mobile-Tech, LLC
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@spikebyte'
    site: '@spikebyte'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: false # No posts published yet; re-enable once real content is live

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: false # No posts published yet; re-enable once real content is live

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: false # No posts published yet; re-enable once real content is live

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
